substitutions:
  voice_assist_idle_phase_id: "1"
  voice_assist_listening_phase_id: "2"
  voice_assist_thinking_phase_id: "3"
  voice_assist_replying_phase_id: "4"
  voice_assist_not_ready_phase_id: "10"
  voice_assist_error_phase_id: "11"
  voice_assist_muted_phase_id: "12"

esphome:
  name: jarvis-1
  friendly_name: jarvis-1
  min_version: 2025.5.0
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: 600
    then:
      - script.execute: draw_display
      - delay: 5s
      - lambda: id(init_in_progress) = false;
      - script.execute: draw_display
      - delay: 2s
      - switch.turn_on: speaker_enable_switch
      - delay: 500ms
      - media_player.volume_set:
          id: speaker_media_player
          volume: 80%
      - rtttl.play: "boot:d=4,o=5,b=200:c6,e6,g6"

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: "YAeLK8vZ3S0Bki6+TpEYvLpybaEBbJgOjI9gcAdLrn0="
  max_connections: 4
  on_client_connected:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: draw_display

ota:
  - platform: esphome
    password: "82c9f1c08c9a9d76ce27cffca056b4de"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Jarvis-1 Fallback Hotspot"
    password: "mXF1QVvdA6Pn"
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

captive_portal:

# --- Globals ---
globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: touch_active
    type: bool
    restore_value: false
    initial_value: "false"

# --- I2C Bus (codecs + touchscreen) ---
i2c:
  scl: GPIO18
  sda: GPIO8

# --- Audio (single shared I2S bus) ---
i2s_audio:
  - id: i2s_shared
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO2

# --- Audio Codecs ---
audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_shared
    adc_type: external
    i2s_din_pin: GPIO16
    bits_per_sample: 16bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_shared
    dac_type: external
    i2s_dout_pin: GPIO15
    bits_per_sample: 16bit
    sample_rate: 48000
    channel: left
    audio_dac: es8311_dac
    buffer_duration: 100ms

# --- Media Player (wraps speaker for TTS playback) ---
media_player:
  - platform: speaker
    name: "Jarvis Speaker"
    id: speaker_media_player
    volume_min: 0.6
    volume_max: 0.85
    on_announcement:
      - media_player.volume_set: 1.0
    announcement_pipeline:
      speaker: box_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1

# --- Boot Chime ---
rtttl:
  id: boot_buzzer
  speaker: box_speaker

# --- Outputs ---
output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

# --- Display Backlight ---
light:
  - platform: monochromatic
    output: backlight_output
    name: "LCD Backlight"
    id: lcd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# --- Touchscreen ---
touchscreen:
  - platform: gt911
    id: box_touchscreen
    interrupt_pin: GPIO3

# --- Fonts ---
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_large
    size: 28
    glyphsets:
      - GF_Latin_Core
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_medium
    size: 18
    glyphsets:
      - GF_Latin_Core
  - file:
      type: gfonts
      family: Roboto
      weight: 300
      italic: true
    id: font_small
    size: 14
    glyphsets:
      - GF_Latin_Core

# --- Colors ---
color:
  - id: color_white
    hex: "FFFFFF"
  - id: color_green
    hex: "00CC66"
  - id: color_blue
    hex: "3399FF"
  - id: color_yellow
    hex: "FFCC00"
  - id: color_orange
    hex: "FF9933"
  - id: color_red
    hex: "FF3333"
  - id: color_gray
    hex: "666666"

# --- Text Sensors ---
text_sensor:
  - id: text_request
    platform: template
    on_value:
      lambda: |-
        if(id(text_request).state.length()>42) {
          std::string name = id(text_request).state.c_str();
          std::string truncated = esphome::str_truncate(name.c_str(),41);
          id(text_request).state = (truncated+"...").c_str();
        }
  - id: text_response
    platform: template
    on_value:
      lambda: |-
        if(id(text_response).state.length()>90) {
          std::string name = id(text_response).state.c_str();
          std::string truncated = esphome::str_truncate(name.c_str(),89);
          id(text_response).state = (truncated+"...").c_str();
        }

# --- Display ---
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6

display:
  - platform: ili9xxx
    id: s3_box_lcd
    model: S3BOX
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin:
      number: GPIO48
      inverted: true
    invert_colors: false
    data_rate: 40MHz
    update_interval: never
    pages:
      - id: initializing_page
        lambda: |-
          it.fill(Color::BLACK);
          it.printf(160, 90, id(font_large), id(color_white), TextAlign::CENTER, "JARVIS");
          it.printf(160, 130, id(font_medium), id(color_yellow), TextAlign::CENTER, "Initializing...");
      - id: diag_page
        lambda: |-
          it.fill(Color::BLACK);
          it.printf(10, 10, id(font_large), id(color_white), TextAlign::TOP_LEFT, "JARVIS DIAG");
          // Wi-Fi status
          if (id(wifi_connected).state) {
            it.printf(10, 50, id(font_medium), id(color_green), TextAlign::TOP_LEFT, "WiFi: OK");
          } else {
            it.printf(10, 50, id(font_medium), id(color_red), TextAlign::TOP_LEFT, "WiFi: DISCONNECTED");
          }
          // API status
          if (id(api_connected_sensor).state) {
            it.printf(10, 75, id(font_medium), id(color_green), TextAlign::TOP_LEFT, "HA API: OK");
          } else {
            it.printf(10, 75, id(font_medium), id(color_red), TextAlign::TOP_LEFT, "HA API: DISCONNECTED");
          }
          // Touch status
          if (id(touch_active)) {
            it.printf(10, 100, id(font_medium), id(color_blue), TextAlign::TOP_LEFT, "Touch: ACTIVE");
          } else {
            it.printf(10, 100, id(font_medium), id(color_gray), TextAlign::TOP_LEFT, "Touch: waiting...");
          }
          // Mute button
          if (id(mute_button).state) {
            it.printf(10, 125, id(font_medium), id(color_blue), TextAlign::TOP_LEFT, "Mute Btn: PRESSED");
          } else {
            it.printf(10, 125, id(font_medium), id(color_gray), TextAlign::TOP_LEFT, "Mute Btn: released");
          }
          // Voice phase
          it.printf(10, 150, id(font_medium), id(color_white), TextAlign::TOP_LEFT, "VA Phase: %d", id(voice_assistant_phase));
          // Instructions
          it.filled_rectangle(0, 190, 320, 50, id(color_blue));
          it.printf(160, 205, id(font_medium), id(color_white), TextAlign::CENTER, "TAP SCREEN TO TALK");
      - id: listening_page
        lambda: |-
          it.fill(Color(0, 20, 60));
          it.filled_circle(160, 100, 50, id(color_blue));
          it.printf(160, 165, id(font_large), id(color_white), TextAlign::CENTER, "Listening...");
      - id: thinking_page
        lambda: |-
          it.fill(Color(0, 20, 60));
          it.filled_circle(160, 70, 35, id(color_yellow));
          it.printf(160, 125, id(font_large), id(color_white), TextAlign::CENTER, "Thinking...");
          if (id(text_request).state.length() > 0) {
            it.printf(160, 170, id(font_small), id(color_white), TextAlign::CENTER, "\"%s\"", id(text_request).state.c_str());
          }
      - id: replying_page
        lambda: |-
          it.fill(Color(0, 20, 60));
          it.printf(10, 10, id(font_small), id(color_gray), TextAlign::TOP_LEFT, "You: %s", id(text_request).state.c_str());
          // Word-wrap response text
          std::string resp = id(text_response).state;
          int max_chars = 30;
          int y = 40;
          int start = 0;
          while (start < resp.length() && y < 190) {
            int end = start + max_chars;
            if (end < resp.length()) {
              int space = resp.rfind(' ', end);
              if (space > start) end = space;
            } else {
              end = resp.length();
            }
            std::string line = resp.substr(start, end - start);
            it.printf(10, y, id(font_medium), id(color_white), TextAlign::TOP_LEFT, "%s", line.c_str());
            start = end + 1;
            y += 22;
          }
          it.filled_rectangle(0, 210, 320, 30, id(color_green));
          it.printf(160, 218, id(font_small), Color::BLACK, TextAlign::CENTER, "Speaking...");
      - id: error_page
        lambda: |-
          it.fill(Color::BLACK);
          it.filled_circle(160, 100, 40, id(color_red));
          it.printf(160, 100, id(font_large), Color::WHITE, TextAlign::CENTER, "!");
          it.printf(160, 165, id(font_medium), id(color_red), TextAlign::CENTER, "Error");

# --- Scripts ---
script:
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - lambda: |
                switch(id(voice_assistant_phase)) {
                  case ${voice_assist_listening_phase_id}:
                    id(s3_box_lcd).show_page(listening_page);
                    break;
                  case ${voice_assist_thinking_phase_id}:
                    id(s3_box_lcd).show_page(thinking_page);
                    break;
                  case ${voice_assist_replying_phase_id}:
                    id(s3_box_lcd).show_page(replying_page);
                    break;
                  case ${voice_assist_error_phase_id}:
                    id(s3_box_lcd).show_page(error_page);
                    break;
                  default:
                    id(s3_box_lcd).show_page(diag_page);
                }
            - component.update: s3_box_lcd
          else:
            - display.page.show: initializing_page
            - component.update: s3_box_lcd

  - id: refresh_diag
    then:
      - if:
          condition:
            lambda: return id(voice_assistant_phase) == ${voice_assist_idle_phase_id} || id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id};
          then:
            - display.page.show: diag_page
            - component.update: s3_box_lcd

# --- On-device Wake Word ---
micro_wake_word:
  models:
    - model: hey_jarvis
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# --- Voice Assistant ---
voice_assistant:
  id: va
  microphone: box_mic
  media_player: speaker_media_player
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 3.0
  on_listening:
    - text_sensor.template.publish:
        id: text_request
        state: ""
    - text_sensor.template.publish:
        id: text_response
        state: ""
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - script.execute: draw_display
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: draw_display
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - script.execute: draw_display
  on_tts_start:
    - switch.turn_on: speaker_enable_switch
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - script.execute: draw_display
  on_tts_end:
    - logger.log: "TTS audio finished, waiting for speaker..."
    - wait_until:
        not:
          speaker.is_playing:
    - logger.log: "Speaker done playing"
    - delay: 8s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: draw_display
    - micro_wake_word.start:
  on_end:
    - logger.log: "Voice assistant pipeline ended"
    - if:
        condition:
          lambda: return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          - script.execute: draw_display
          - micro_wake_word.start:
  on_error:
    - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
    - script.execute: draw_display
    - delay: 3s
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: draw_display
    - micro_wake_word.start:
  on_client_connected:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - micro_wake_word.start:
    - script.execute: draw_display
  on_client_disconnected:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - voice_assistant.stop:
    - micro_wake_word.stop:
    - script.execute: draw_display

# --- Binary Sensors ---
binary_sensor:
  # Mute button - GPIO1 (NOT GPIO0)
  - platform: gpio
    pin:
      number: GPIO1
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Mute Button"
    id: mute_button
    on_press:
      - logger.log: "MUTE BUTTON PRESSED"
      - script.execute: refresh_diag
    on_release:
      - logger.log: "MUTE BUTTON RELEASED"
      - script.execute: refresh_diag

  # Tap screen to talk
  - platform: touchscreen
    name: "Screen Tap"
    id: screen_tap
    touchscreen_id: box_touchscreen
    x_min: 0
    x_max: 319
    y_min: 0
    y_max: 239
    on_press:
      - logger.log: "SCREEN TAPPED - starting voice assistant"
      - lambda: id(touch_active) = true;
      - micro_wake_word.stop:
      - delay: 200ms
      - voice_assistant.start:
      - script.execute: refresh_diag
    on_release:
      - lambda: id(touch_active) = false;
      - script.execute: refresh_diag

  # Track wifi/api status for diag display
  - platform: status
    name: "API Connected"
    id: api_connected_sensor

  - platform: template
    name: "WiFi Connected"
    id: wifi_connected
    lambda: return wifi::global_wifi_component->is_connected();

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 10s

# --- Speaker Enable ---
switch:
  - platform: gpio
    name: "Speaker Enable"
    id: speaker_enable_switch
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: RESTORE_DEFAULT_ON

# --- Periodic diag refresh ---
interval:
  - interval: 2s
    then:
      - script.execute: refresh_diag
